# API + Prometheus + Grafana.
#   docker compose up --build
#   API:        http://localhost:8000/docs
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000  (dashboard "Heatsim")
#
# Docker on macOS runs a Linux VM with no access to the Metal GPU, so the API
# container uses the numba backend. To get GPU jobs, run the API natively
# (make serve) and point Prometheus at host.docker.internal instead - see
# monitoring/prometheus.yml.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      HEATSIM_WORKERS: "2"
      HEATSIM_COST_PER_HOUR: "0.53"
    volumes:
      - job-data:/data

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/heatsim.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  job-data:
